[package]
name = "easy_editor"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.28"       # latest stable
egui = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cxx = "1.0"
image = "0.25"        # for loading chipsets
rfd = "0.14"          # native file picker

[build-dependencies]
cxx-build = "1.0"
