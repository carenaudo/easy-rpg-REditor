[package]
name = "easy_editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace]
resolver = "3"
members = [
    ".",
    "crates/lcf-core",
    "crates/lcf-codegen",
]

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
rfd = "0.17"
png = "0.18"
miniz_oxide = "0.9"
rust-i18n = "4"
sys-locale = "0.3"
rustysynth = "1.3"
rodio = "0.22"
lcf-core = { path = "crates/lcf-core" }
