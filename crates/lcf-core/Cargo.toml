[package]
name = "lcf-core"
version = "0.1.0"
edition = "2024"
description = "Pure Rust parser, serializer, and data model for RPG Maker 2000/2003 LCF formats"

[dependencies]
encoding_rs = "0.8"
thiserror = "2.0"
byteorder = "1.5"
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
